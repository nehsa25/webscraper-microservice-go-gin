name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet every tag combination
        run: |
          go vet ./...
          go vet -tags=integration ./test/...
          go vet -tags=e2e ./test/...

      - name: Unit tests
        run: go test -race -timeout=60s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pin BOTH the action major and the golangci-lint version.
      #
      # Action v6 installs golangci-lint v1, which cannot read this repo's
      # `version: "2"` .golangci.yml and fails with a jsonschema error. And
      # `version: latest` is a second trap: the released binary is built with
      # whatever Go its maintainers used, and golangci-lint refuses to run when
      # that is older than the `go` directive in go.mod. Either way a repo can
      # be lint-clean locally and red in CI. Pinning both makes the pairing
      # explicit and reviewable.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  integration:
    name: Integration tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration -race -timeout=10m ./test/integration/...

  e2e:
    name: E2E tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=e2e -timeout=10m ./test/e2e/...

  # One required check to protect the branch with, so the rule does not need
  # editing every time a job is added or renamed.
  all-green:
    name: All tiers green
    runs-on: ubuntu-latest
    needs: [unit, lint, integration, e2e]
    if: always()
    steps:
      - run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "tier results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required tier did not pass: $results"; exit 1
            fi
          done
